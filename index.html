<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel-Ops — Lighthouse 3D Reconstruction</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, sans-serif; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #eee; text-align: center;
    background: radial-gradient(circle at center, #14181d 0%, #0b0d10 100%);
    z-index: 10;
  }
  #overlay h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  #overlay p { color: #9aa4af; margin-top: 0; max-width: 420px; }
  #startBtn {
    margin-top: 1.2rem; padding: 0.75rem 2rem; font-size: 1rem; cursor: pointer;
    background: #3b82f6; color: white; border: none; border-radius: 8px;
  }
  #startBtn:hover { background: #2563eb; }
  #hud {
    position: absolute; bottom: 12px; left: 12px; color: #9aa4af;
    font-size: 0.75rem; background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px;
    display: none;
  }
  #loadingText {
    position: absolute; bottom: 20px; color: #9aa4af; font-size: 0.85rem; display: none;
  }
  canvas { display: block; }
</style>
</head>
<body>

<div id="overlay">
  <h1>Lighthouse — Pixel-Ops 3D Reconstruction</h1>
  <p>3D point cloud reconstructed with COLMAP Structure-from-Motion from 200 survey images.</p>
  <button id="startBtn">OK — View 3D Model</button>
  <div id="loadingText">Loading point cloud…</div>
</div>

<div id="hud">Left-drag: rotate • Right-drag: pan • Scroll: zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
  import { PLYLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/PLYLoader.js';

  const MODEL_PATH = 'model/lighthouse.ply'; // generated by scripts/prepare_web_model.py

  let scene, camera, renderer, controls;

  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02070d);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 3);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // OrbitControls gives full mouse control in every direction:
    // left-drag = orbit/rotate, right-drag = pan, scroll = zoom/dolly.
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;
    controls.minDistance = 0.05;
    controls.maxDistance = 100;

    window.addEventListener('resize', onResize);
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function loadModel() {
    const loader = new PLYLoader();
    loader.load(
      MODEL_PATH,
      (geometry) => {
        geometry.computeBoundingSphere();
        const hasColor = !!geometry.getAttribute('color');

        const material = new THREE.PointsMaterial({
          size: 0.06,
          vertexColors: hasColor,
          transparent: true,
          opacity: 0.96,
          color: hasColor ? 0xffffff : 0x9ec7ff,
          toneMapped: false,
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // Frame the camera on the model automatically.
        const sphere = geometry.boundingSphere;
        const center = sphere.center;
        const radius = Math.max(sphere.radius, 0.1);
        camera.position.set(
          center.x + radius * 0.85,
          center.y + radius * 0.35,
          center.z + radius * 0.95
        );
        controls.target.copy(center);
        controls.update();

        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        animate();
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const pct = ((xhr.loaded / xhr.total) * 100).toFixed(0);
          document.getElementById('loadingText').textContent = `Loading point cloud… ${pct}%`;
        }
      },
      (err) => {
        document.getElementById('loadingText').textContent =
          'Failed to load model.ply — check that it was uploaded next to index.html.';
        console.error(err);
      }
    );
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('loadingText').style.display = 'block';
    initScene();
    loadModel();
  });
</script>
</body>
</html>
